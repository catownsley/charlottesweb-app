name: Security Scan (PR Quick)

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (Quick)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:python

  bandit:
    name: Bandit (Quick SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[sarif]"

      - name: Run Bandit
        run: |
          bandit -r src -f sarif -o bandit-results.sarif

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  pip-audit:
    name: Dependency Vulnerabilities (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Verify dependency integrity (hash-verified install)
        run: |
          # uv installs strictly from uv.lock and verifies every package
          # against the cryptographic hashes recorded there. A tampered or
          # swapped package fails the hash check and the build fails.
          uv sync --locked

      - name: Scan dependencies for vulnerabilities
        run: |
          # Export the locked production dependencies (with hashes) and audit
          # them against the OSV/PyPI advisory database.
          uv export --frozen --no-emit-project --no-dev --format requirements-txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --desc --ignore-vuln CVE-2026-4539  # pygments: no fix available, local-access-only regex complexity

  lock-sync:
    name: Lock File Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Verify uv.lock matches pyproject.toml
        run: |
          # Asserts uv.lock is fully resolved and consistent with
          # pyproject.toml. Fails if the lock would change, which means the
          # lock was not regenerated after a dependency edit. Fix locally with
          # `uv lock` and commit uv.lock.
          uv lock --locked
